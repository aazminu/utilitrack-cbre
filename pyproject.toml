[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utilitrack"
version = "1.0.0"
description = "UtiliTrack: Commercial Real Estate HVAC/Chiller Energy Telemetry, Weather-Normalized EUI Regression & SLA Work-Order Dispatch Engine (1st Place CBRE Challenge & 3rd Place Overall @ HackUNT 2024)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Azmi", email = "m4u5t4@u.northwestern.edu" }
]
keywords = ["cbre", "bms", "hvac", "energy-telemetry", "eui", "cusum", "facility-management", "hackunt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://abdullahazmi.com"
Repository = "https://github.com/aazminu/utilitrack-cbre"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
